<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <style>
      .node rect { rx: 8; ry: 8; stroke-width: 2px; }
      .label { font-family: Arial, sans-serif; font-size: 14px; }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Phase 1: Current State -->
  <rect x="20" y="20" width="250" height="360" fill="#fafafa" stroke="#ccc" rx="8"/>
  <text x="145" y="50" text-anchor="middle" class="title">Phase 1: Current</text>
  
  <rect x="40" y="80" width="210" height="60" fill="#e3f2fd" stroke="#1976d2" rx="6"/>
  <text x="145" y="105" text-anchor="middle" class="label">VMware vSphere</text>
  <text x="145" y="125" text-anchor="middle" class="label" style="font-size:12px">All Workloads</text>
  
  <rect x="40" y="160" width="210" height="50" fill="#fff" stroke="#ccc" rx="6"/>
  <text x="145" y="190" text-anchor="middle" class="label">Veeam Backup</text>
  
  <rect x="40" y="230" width="210" height="50" fill="#fff" stroke="#ccc" rx="6"/>
  <text x="145" y="260" text-anchor="middle" class="label">Veritas (Cohesity)</text>
  
  <!-- Arrow 1 -->
  <path d="M270 200 L350 200" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="310" y="185" text-anchor="middle" class="label" style="font-size:11px">Migrate</text>
  
  <!-- Phase 2: Dual-Hypervisor -->
  <rect x="350" y="20" width="250" height="360" fill="#f3e5f5" stroke="#7b1fa2" rx="8"/>
  <text x="475" y="50" text-anchor="middle" class="title">Phase 2: Dual</text>
  
  <rect x="370" y="80" width="210" height="50" fill="#e3f2fd" stroke="#1976d2" rx="6"/>
  <text x="475" y="110" text-anchor="middle" class="label">VMware (Legacy)</text>
  
  <rect x="370" y="150" width="210" height="50" fill="#e8f5e9" stroke="#388e3c" rx="6"/>
  <text x="475" y="180" text-anchor="middle" class="label">Proxmox VE / Sangfor</text>
  
  <rect x="370" y="220" width="210" height="50" fill="#fff" stroke="#ccc" rx="6"/>
  <text x="475" y="250" text-anchor="middle" class="label">Shared Storage</text>
  
  <rect x="370" y="290" width="210" height="50" fill="#fff" stroke="#ccc" rx="6"/>
  <text x="475" y="320" text-anchor="middle" class="label">Veeam (Both)</text>
  
  <!-- Arrow 2 -->
  <path d="M600 200 L680 200" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="640" y="185" text-anchor="middle" class="label" style="font-size:11px">Complete</text>
  
  <!-- Phase 3: Target State -->
  <rect x="680" y="20" width="200" height="360" fill="#e8f5e9" stroke="#388e3c" rx="8"/>
  <text x="780" y="50" text-anchor="middle" class="title">Phase 3: Target</text>
  
  <rect x="700" y="80" width="160" height="60" fill="#c8e6c9" stroke="#388e3c" rx="6"/>
  <text x="780" y="105" text-anchor="middle" class="label">Proxmox VE</text>
  <text x="780" y="125" text-anchor="middle" class="label" style="font-size:12px">All Workloads</text>
  
  <rect x="700" y="160" width="160" height="50" fill="#fff" stroke="#ccc" rx="6"/>
  <text x="780" y="190" text-anchor="middle" class="label">Veeam Backup</text>
  
  <rect x="700" y="230" width="160" height="50" fill="#fff" stroke="#ccc" rx="6"/>
  <text x="780" y="260" text-anchor="middle" class="label">Cost Savings</text>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
