<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 13px; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    </style>
  </defs>
  
  <!-- User Request -->
  <rect x="20" y="125" width="140" height="100" fill="#e3f2fd" stroke="#1976d2" rx="8"/>
  <text x="90" y="160" text-anchor="middle" class="label" style="font-weight:bold">User Request</text>
  <text x="90" y="180" text-anchor="middle" class="label">Natural Language</text>
  <text x="90" y="200" text-anchor="middle" class="label">Intent Detection</text>
  
  <!-- Arrow -->
  <path d="M160 175 L200 175" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- AI Agent -->
  <rect x="200" y="50" width="180" height="250" fill="#f3e5f5" stroke="#7b1fa2" rx="8"/>
  <text x="290" y="75" text-anchor="middle" class="title" style="fill:#7b1fa2">AI Agent</text>
  
  <rect x="220" y="90" width="140" height="35" fill="#fff" stroke="#7b1fa2" rx="4"/>
  <text x="290" y="112" text-anchor="middle" class="label">Task Planning</text>
  
  <rect x="220" y="135" width="140" height="35" fill="#fff" stroke="#7b1fa2" rx="4"/>
  <text x="290" y="157" text-anchor="middle" class="label">Tool Selection</text>
  
  <rect x="220" y="180" width="140" height="35" fill="#fff" stroke="#7b1fa2" rx="4"/>
  <text x="290" y="202" text-anchor="middle" class="label">Execution</text>
  
  <rect x="220" y="225" width="140" height="35" fill="#fff" stroke="#7b1fa2" rx="4"/>
  <text x="290" y="247" text-anchor="middle" class="label">Result Synthesis</text>
  
  <!-- Arrow -->
  <path d="M380 175 L420 175" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Tools -->
  <rect x="420" y="50" width="160" height="250" fill="#fff3e0" stroke="#f57c00" rx="8"/>
  <text x="500" y="75" text-anchor="middle" class="title" style="fill:#f57c00">Tools</text>
  
  <rect x="440" y="90" width="120" height="30" fill="#fff" stroke="#f57c00" rx="4"/>
  <text x="500" y="110" text-anchor="middle" class="label">Database</text>
  
  <rect x="440" y="130" width="120" height="30" fill="#fff" stroke="#f57c00" rx="4"/>
  <text x="500" y="150" text-anchor="middle" class="label">API Calls</text>
  
  <rect x="440" y="170" width="120" height="30" fill="#fff" stroke="#f57c00" rx="4"/>
  <text x="500" y="190" text-anchor="middle" class="label">File System</text>
  
  <rect x="440" y="210" width="120" height="30" fill="#fff" stroke="#f57c00" rx="4"/>
  <text x="500" y="230" text-anchor="middle" class="label">External APIs</text>
  
  <!-- Arrow -->
  <path d="M580 175 L620 175" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Response -->
  <rect x="620" y="100" width="160" height="150" fill="#e8f5e9" stroke="#388e3c" rx="8"/>
  <text x="700" y="125" text-anchor="middle" class="title" style="fill:#388e3c">Response</text>
  
  <rect x="640" y="140" width="120" height="30" fill="#fff" stroke="#388e3c" rx="4"/>
  <text x="700" y="160" text-anchor="middle" class="label">Structured Data</text>
  
  <rect x="640" y="180" width="120" height="30" fill="#fff" stroke="#388e3c" rx="4"/>
  <text x="700" y="200" text-anchor="middle" class="label">Action Taken</text>
  
  <rect x="640" y="220" width="120" height="30" fill="#fff" stroke="#388e3c" rx="4"/>
  <text x="700" y="240" text-anchor="middle" class="label">Confirmation</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
