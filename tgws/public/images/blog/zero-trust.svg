<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #18181B; }
    .subtitle { font-size: 12px; fill: #71717A; }
    .node-text { font-size: 13px; font-weight: 600; fill: #18181B; }
    .node-sub { font-size: 10px; fill: #71717A; }
    .label { font-size: 11px; font-weight: 600; fill: #71717A; }
    .copyright { font-size: 10px; fill: #71717A; }
    .connector { stroke: #71717A; stroke-width: 1.5; fill: none; }
    .connector-cyan { stroke: #00D4FF; stroke-width: 2; fill: none; }
    .connector-purple { stroke: #7B61FF; stroke-width: 2; fill: none; }
    .connector-dashed { stroke: #71717A; stroke-width: 1.5; fill: none; stroke-dasharray: 6,3; }
    .arrowhead { fill: #71717A; }
    .arrowhead-cyan { fill: #00D4FF; }
    .arrowhead-purple { fill: #7B61FF; }
  </style>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" class="arrowhead"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" class="arrowhead-cyan"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" class="arrowhead-purple"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF" rx="8"/>
  
    <text x="400" y="35" text-anchor="middle" class="title">Zero Trust Network Architecture</text>
    <text x="400" y="52" text-anchor="middle" class="subtitle">Never Trust, Always Verify</text>

    <!-- User -->
    <rect x="50" y="170" width="100" height="80" fill="#F4F4F5" stroke="#D4D4D8" rx="8"/>
    <text x="100" y="205" class="node-text">User</text>
    <text x="100" y="220" class="node-sub">Device</text>

    <!-- Step 1: Identity -->
    <rect x="200" y="100" width="120" height="70" fill="#00D4FF20" stroke="#00D4FF" rx="8"/>
    <text x="260" y="130" class="node-text">Identity</text>
    <text x="260" y="145" class="node-sub">MFA / SSO</text>

    <!-- Step 2: Device -->
    <rect x="370" y="100" width="120" height="70" fill="#7B61FF20" stroke="#7B61FF" rx="8"/>
    <text x="430" y="130" class="node-text">Device</text>
    <text x="430" y="145" class="node-sub">Health Check</text>

    <!-- Step 3: App Access -->
    <rect x="540" y="100" width="120" height="70" fill="#00D4FF20" stroke="#00D4FF" rx="8"/>
    <text x="600" y="130" class="node-text">App Access</text>
    <text x="600" y="145" class="node-sub">Micro-Seg</text>

    <!-- Step 4: Data Protection -->
    <rect x="690" y="170" width="100" height="80" fill="#7B61FF20" stroke="#7B61FF" rx="8"/>
    <text x="740" y="205" class="node-text">Data</text>
    <text x="740" y="220" class="node-sub">Protect</text>

    <!-- Arrows flow -->
    <line x1="150" y1="210" x2="200" y2="145" class="connector-cyan" marker-end="url(#arrowCyan)"/>
    <line x1="320" y1="135" x2="370" y2="135" class="connector-purple" marker-end="url(#arrowPurple)"/>
    <line x1="490" y1="135" x2="540" y2="135" class="connector-cyan" marker-end="url(#arrowCyan)"/>
    <line x1="660" y1="135" x2="690" y2="195" class="connector-purple" marker-end="url(#arrowPurple)"/>

    <!-- Policy Engine -->
    <rect x="280" y="210" width="240" height="60" fill="#FAFAFA" stroke="#18181B" rx="8"/>
    <text x="400" y="238" class="node-text">Policy Decision Point</text>
    <text x="400" y="253" class="node-sub">Continuous Evaluation</text>

    <!-- Arrows to policy -->
    <line x1="260" y1="170" x2="370" y2="210" class="connector-dashed" marker-end="url(#arrowGray)"/>
    <line x1="430" y1="170" x2="430" y2="210" class="connector-dashed" marker-end="url(#arrowGray)"/>

    <!-- Bottom: Resources -->
    <rect x="100" y="320" width="150" height="50" fill="#FFFFFF" stroke="#00D4FF" rx="8"/>
    <text x="175" y="350" class="node-text">Cloud Apps</text>

    <rect x="300" y="320" width="150" height="50" fill="#FFFFFF" stroke="#00D4FF" rx="8"/>
    <text x="375" y="350" class="node-text">On-Prem Apps</text>

    <rect x="500" y="320" width="150" height="50" fill="#FFFFFF" stroke="#00D4FF" rx="8"/>
    <text x="575" y="350" class="node-text">Data Stores</text>

    <line x1="340" y1="270" x2="175" y2="320" class="connector-cyan" marker-end="url(#arrowCyan)"/>
    <line x1="400" y1="270" x2="375" y2="320" class="connector-cyan" marker-end="url(#arrowCyan)"/>
    <line x1="460" y1="270" x2="575" y2="320" class="connector-cyan" marker-end="url(#arrowCyan)"/>

    <!-- Log box -->
    <rect x="620" y="290" width="140" height="80" fill="#F4F4F5" stroke="#D4D4D8" rx="8"/>
    <text x="690" y="320" class="node-text">SIEM / Log</text>
    <text x="690" y="335" class="node-sub">Analytics</text>
    <text x="690" y="350" class="node-sub">Audit Trail</text>
  
  <text x="400" y="438" text-anchor="middle" class="copyright">© TechGuru</text>
</svg>