<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #18181B; }
    .subtitle { font-size: 12px; fill: #71717A; }
    .node-text { font-size: 13px; font-weight: 600; fill: #18181B; }
    .node-sub { font-size: 10px; fill: #71717A; }
    .label { font-size: 11px; font-weight: 600; fill: #71717A; }
    .copyright { font-size: 10px; fill: #71717A; }
    .connector { stroke: #71717A; stroke-width: 1.5; fill: none; }
    .connector-cyan { stroke: #00D4FF; stroke-width: 2; fill: none; }
    .connector-purple { stroke: #7B61FF; stroke-width: 2; fill: none; }
    .connector-dashed { stroke: #71717A; stroke-width: 1.5; fill: none; stroke-dasharray: 6,3; }
    .arrowhead { fill: #71717A; }
    .arrowhead-cyan { fill: #00D4FF; }
    .arrowhead-purple { fill: #7B61FF; }
  </style>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" class="arrowhead"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" class="arrowhead-cyan"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" class="arrowhead-purple"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF" rx="8"/>
  
    <text x="400" y="35" text-anchor="middle" class="title">FortiGate Firewall Deployment</text>
    <text x="400" y="52" text-anchor="middle" class="subtitle">Internet → FortiGate → DMZ → Internal</text>

    <!-- Internet Cloud -->
    <g>
    <ellipse cx="100" cy="200" rx="42" ry="35" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1.5"/>
    <ellipse cx="122" cy="195" rx="33.6" ry="30" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1.5"/>
    <ellipse cx="110" cy="205" rx="36" ry="25" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="1.5"/>
  </g>
    <text x="110" y="205" text-anchor="middle" class="node-text">Internet</text>

    <!-- FortiGate -->
    <rect x="230" y="130" width="130" height="140" fill="#00D4FF15" stroke="#00D4FF" rx="8"/>
    <text x="295" y="165" class="node-text">FortiGate</text>
    <text x="295" y="182" class="node-sub">NGFW</text>
    <text x="295" y="197" class="node-sub">IPS / AV</text>
    <text x="295" y="212" class="node-sub">SSL Inspect</text>
    <text x="295" y="227" class="node-sub">VPN</text>

    <!-- DMZ -->
    <rect x="420" y="100" width="150" height="80" fill="#7B61FF15" stroke="#7B61FF" rx="8"/>
    <text x="495" y="130" class="node-text">DMZ</text>
    <text x="495" y="148" class="node-sub">Web Servers</text>
    <text x="495" y="163" class="node-sub">Mail Gateway</text>

    <!-- Internal Network -->
    <rect x="640" y="100" width="140" height="80" fill="#FFFFFF" stroke="#18181B" rx="8"/>
    <text x="710" y="130" class="node-text">Internal LAN</text>
    <text x="710" y="148" class="node-sub">Users</text>
    <text x="710" y="163" class="node-sub">Applications</text>

    <!-- Servers -->
    <rect x="640" y="210" width="140" height="60" fill="#FFFFFF" stroke="#18181B" rx="8"/>
    <text x="710" y="238" class="node-text">Servers</text>
    <text x="710" y="253" class="node-sub">DB / ERP</text>

    <!-- Arrows -->
    <line x1="170" y1="200" x2="230" y2="200" class="connector-cyan" marker-end="url(#arrowCyan)"/>
    <line x1="360" y1="175" x2="420" y2="145" class="connector-purple" marker-end="url(#arrowPurple)"/>
    <line x1="360" y1="200" x2="640" y2="145" class="connector-cyan" marker-end="url(#arrowCyan)"/>
    <line x1="640" y1="240" x2="710" y2="210" class="connector" marker-end="url(#arrowGray)"/>

    <!-- Zones label -->
    <text x="295" y="120" text-anchor="middle" class="label">Zone: Untrusted</text>
    <text x="495" y="90" text-anchor="middle" class="label">Zone: DMZ</text>
    <text x="710" y="90" text-anchor="middle" class="label">Zone: Trusted</text>

    <!-- Security policies -->
    <rect x="250" y="310" width="100" height="40" fill="#FEF3C7" stroke="#F59E0B" rx="8"/>
    <text x="300" y="335" text-anchor="middle" class="node-sub" style="fill:#92400E">IPS Scan</text>

    <rect x="370" y="310" width="100" height="40" fill="#FEF3C7" stroke="#F59E0B" rx="8"/>
    <text x="420" y="335" text-anchor="middle" class="node-sub" style="fill:#92400E">App Control</text>

    <rect x="490" y="310" width="100" height="40" fill="#FEF3C7" stroke="#F59E0B" rx="8"/>
    <text x="540" y="335" text-anchor="middle" class="node-sub" style="fill:#92400E">Web Filter</text>

    <line x1="295" y1="270" x2="295" y2="310" class="connector" marker-end="url(#arrowGray)"/>
    <line x1="420" y1="270" x2="420" y2="310" class="connector" marker-end="url(#arrowGray)"/>
    <line x1="540" y1="270" x2="540" y2="310" class="connector" marker-end="url(#arrowGray)"/>

    <text x="420" y="295" text-anchor="middle" class="label">Security Profiles</text>
  
  <text x="400" y="438" text-anchor="middle" class="copyright">© TechGuru</text>
</svg>