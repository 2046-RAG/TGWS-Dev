<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <style>
    text { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #18181B; }
    .subtitle { font-size: 12px; fill: #71717A; }
    .node-text { font-size: 13px; font-weight: 600; fill: #18181B; }
    .node-sub { font-size: 10px; fill: #71717A; }
    .label { font-size: 11px; font-weight: 600; fill: #71717A; }
    .copyright { font-size: 10px; fill: #71717A; }
    .connector { stroke: #71717A; stroke-width: 1.5; fill: none; }
    .connector-cyan { stroke: #00D4FF; stroke-width: 2; fill: none; }
    .connector-purple { stroke: #7B61FF; stroke-width: 2; fill: none; }
    .connector-dashed { stroke: #71717A; stroke-width: 1.5; fill: none; stroke-dasharray: 6,3; }
    .arrowhead { fill: #71717A; }
    .arrowhead-cyan { fill: #00D4FF; }
    .arrowhead-purple { fill: #7B61FF; }
  </style>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" class="arrowhead"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" class="arrowhead-cyan"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" class="arrowhead-purple"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#FFFFFF" rx="8"/>
  
    <text x="400" y="35" text-anchor="middle" class="title">Network Segmentation Architecture</text>
    <text x="400" y="52" text-anchor="middle" class="subtitle">Micro-Segmentation by Security Zone</text>

    <!-- Firewall center -->
    <rect x="340" y="80" width="120" height="50" fill="#00D4FF15" stroke="#00D4FF" rx="8"/>
    <text x="400" y="110" class="node-text">Firewall</text>

    <!-- Office Zone -->
    <rect x="50" y="160" width="160" height="110" fill="#00D4FF10" stroke="#00D4FF" rx="10"/>
    <text x="130" y="185" text-anchor="middle" class="label" style="fill:#00D4FF">OFFICE ZONE</text>
    <rect x="65" y="195" width="130" height="30" fill="#FFFFFF" stroke="#D4D4D8" rx="8"/>
    <text x="130" y="215" text-anchor="middle" class="node-sub">User Workstations</text>
    <rect x="65" y="230" width="130" height="30" fill="#FFFFFF" stroke="#D4D4D8" rx="8"/>
    <text x="130" y="250" text-anchor="middle" class="node-sub">Printers / VoIP</text>

    <!-- Server Zone -->
    <rect x="260" y="160" width="160" height="110" fill="#7B61FF10" stroke="#7B61FF" rx="10"/>
    <text x="340" y="185" text-anchor="middle" class="label" style="fill:#7B61FF">SERVER ZONE</text>
    <rect x="275" y="195" width="130" height="30" fill="#FFFFFF" stroke="#D4D4D8" rx="4"/>
    <text x="340" y="215" text-anchor="middle" class="node-sub">App Servers</text>
    <rect x="275" y="230" width="130" height="30" fill="#FFFFFF" stroke="#D4D4D8" rx="4"/>
    <text x="340" y="250" text-anchor="middle" class="node-sub">Database</text>

    <!-- DMZ -->
    <rect x="470" y="160" width="160" height="110" fill="#FEF3C7" stroke="#F59E0B" rx="10"/>
    <text x="550" y="185" text-anchor="middle" class="label" style="fill:#92400E">DMZ</text>
    <rect x="485" y="195" width="130" height="30" fill="#FFFFFF" stroke="#D4D4D8" rx="4"/>
    <text x="550" y="215" text-anchor="middle" class="node-sub">Web Servers</text>
    <rect x="485" y="230" width="130" height="30" fill="#FFFFFF" stroke="#D4D4D8" rx="4"/>
    <text x="550" y="250" text-anchor="middle" class="node-sub">Mail Gateway</text>

    <!-- Guest Zone -->
    <rect x="660" y="160" width="120" height="110" fill="#F4F4F5" stroke="#D4D4D8" rx="10"/>
    <text x="720" y="185" text-anchor="middle" class="label">GUEST ZONE</text>
    <rect x="675" y="195" width="90" height="30" fill="#FFFFFF" stroke="#D4D4D8" rx="4"/>
    <text x="720" y="215" text-anchor="middle" class="node-sub">Wi-Fi Only</text>
    <rect x="675" y="230" width="90" height="30" fill="#FFFFFF" stroke="#D4D4D8" rx="4"/>
    <text x="720" y="250" text-anchor="middle" class="node-sub">Internet Only</text>

    <!-- Arrows from firewall -->
    <line x1="380" y1="130" x2="130" y2="160" class="connector-cyan" marker-end="url(#arrowCyan)"/>
    <line x1="395" y1="130" x2="340" y2="160" class="connector-purple" marker-end="url(#arrowPurple)"/>
    <line x1="410" y1="130" x2="550" y2="160" class="connector" marker-end="url(#arrowGray)"/>
    <line x1="440" y1="130" x2="720" y2="160" class="connector" marker-end="url(#arrowGray)"/>

    <!-- Zone policies -->
    <rect x="100" y="310" width="600" height="55" fill="#F4F4F5" stroke="#D4D4D8" rx="8"/>
    <text x="400" y="333" text-anchor="middle" class="label">Zone-Based Firewall Policies</text>
    <text x="400" y="350" text-anchor="middle" class="node-sub" style="fill:#18181B">Office↔Server: Allow | Office↔DMZ: Allow (80/443) | Guest: Internet Only | Server↔DMZ: Restricted</text>
  
  <text x="400" y="438" text-anchor="middle" class="copyright">© TechGuru</text>
</svg>