<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .node rect { rx: 8; ry: 8; stroke-width: 2px; }
      .edgePath path { stroke: #666; stroke-width: 2px; fill: none; }
      .label { font-family: Arial, sans-serif; font-size: 14px; }
    </style>
  </defs>
  
  <!-- Warehouse Network -->
  <rect x="20" y="20" width="250" height="180" fill="#fff3e0" stroke="#f57c00" rx="8"/>
  <text x="145" y="45" text-anchor="middle" font-weight="bold" class="label">Warehouse Network</text>
  
  <rect x="40" y="60" width="100" height="40" fill="#fff" stroke="#f57c00" rx="6"/>
  <text x="90" y="85" text-anchor="middle" class="label">WMS Server</text>
  
  <rect x="160" y="60" width="100" height="40" fill="#fff" stroke="#f57c00" rx="6"/>
  <text x="210" y="85" text-anchor="middle" class="label">Barcode Scanner</text>
  
  <rect x="40" y="120" width="100" height="40" fill="#fff" stroke="#f57c00" rx="6"/>
  <text x="90" y="145" text-anchor="middle" class="label">RFID Reader</text>
  
  <rect x="160" y="120" width="100" height="40" fill="#fff" stroke="#f57c00" rx="6"/>
  <text x="210" y="145" text-anchor="middle" class="label">Fleet WiFi</text>
  
  <!-- Fleet Management -->
  <rect x="20" y="220" width="250" height="120" fill="#e3f2fd" stroke="#1976d2" rx="8"/>
  <text x="145" y="245" text-anchor="middle" font-weight="bold" class="label">Fleet Management</text>
  
  <rect x="40" y="260" width="100" height="40" fill="#fff" stroke="#1976d2" rx="6"/>
  <text x="90" y="285" text-anchor="middle" class="label">GPS Tracker</text>
  
  <rect x="160" y="260" width="100" height="40" fill="#fff" stroke="#1976d2" rx="6"/>
  <text x="210" y="285" text-anchor="middle" class="label">Route Planner</text>
  
  <!-- Core Infrastructure -->
  <rect x="350" y="100" width="120" height="50" fill="#e8eaf6" stroke="#3f51b5" rx="6"/>
  <text x="410" y="130" text-anchor="middle" class="label">SD-WAN Hub</text>
  
  <rect x="520" y="100" width="120" height="50" fill="#fce4ec" stroke="#c62828" rx="6"/>
  <text x="580" y="130" text-anchor="middle" class="label">NGFW Firewall</text>
  
  <rect x="690" y="60" width="100" height="40" fill="#e8f5e9" stroke="#388e3c" rx="6"/>
  <text x="740" y="85" text-anchor="middle" class="label">Cloud ERP</text>
  
  <rect x="690" y="140" width="100" height="40" fill="#e8eaf6" stroke="#3f51b5" rx="6"/>
  <text x="740" y="165" text-anchor="middle" class="label">MDR SOC</text>
  
  <!-- Connections -->
  <path d="M260 140 L350 125" stroke="#666" stroke-width="2" fill="none"/>
  <path d="M260 280 L350 125" stroke="#666" stroke-width="2" fill="none"/>
  <path d="M470 125 L520 125" stroke="#666" stroke-width="2" fill="none"/>
  <path d="M640 125 L690 80" stroke="#666" stroke-width="2" fill="none"/>
  <path d="M640 125 L690 155" stroke="#666" stroke-width="2" fill="none"/>
</svg>
