<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .node rect { rx: 8; ry: 8; stroke-width: 2px; }
      .edgePath path { stroke: #666; stroke-width: 2px; fill: none; }
      .label { font-family: Arial, sans-serif; font-size: 14px; }
    </style>
  </defs>
  
  <!-- Government Network -->
  <rect x="20" y="20" width="250" height="180" fill="#e8eaf6" stroke="#3f51b5" rx="8"/>
  <text x="145" y="45" text-anchor="middle" font-weight="bold" class="label">Government Network</text>
  
  <rect x="40" y="60" width="100" height="40" fill="#fff" stroke="#3f51b5" rx="6"/>
  <text x="90" y="85" text-anchor="middle" class="label">政务云</text>
  
  <rect x="160" y="60" width="100" height="40" fill="#fff" stroke="#3f51b5" rx="6"/>
  <text x="210" y="85" text-anchor="middle" class="label">数据中心</text>
  
  <rect x="40" y="120" width="100" height="40" fill="#fff" stroke="#3f51b5" rx="6"/>
  <text x="90" y="145" text-anchor="middle" class="label">安全隔离区</text>
  
  <rect x="160" y="120" width="100" height="40" fill="#fff" stroke="#3f51b5" rx="6"/>
  <text x="210" y="145" text-anchor="middle" class="label">公共服务</text>
  
  <!-- Public Services -->
  <rect x="20" y="220" width="250" height="120" fill="#e8f5e9" stroke="#388e3c" rx="8"/>
  <text x="145" y="245" text-anchor="middle" font-weight="bold" class="label">Public Services</text>
  
  <rect x="40" y="260" width="100" height="40" fill="#fff" stroke="#388e3c" rx="6"/>
  <text x="90" y="285" text-anchor="middle" class="label">市民门户</text>
  
  <rect x="160" y="260" width="100" height="40" fill="#fff" stroke="#388e3c" rx="6"/>
  <text x="210" y="285" text-anchor="middle" class="label">移动APP</text>
  
  <!-- Core Infrastructure -->
  <rect x="350" y="100" width="120" height="50" fill="#fff3e0" stroke="#f57c00" rx="6"/>
  <text x="410" y="130" text-anchor="middle" class="label">核心交换</text>
  
  <rect x="520" y="100" width="120" height="50" fill="#fce4ec" stroke="#c62828" rx="6"/>
  <text x="580" y="130" text-anchor="middle" class="label">安全网关</text>
  
  <rect x="690" y="60" width="100" height="40" fill="#e8eaf6" stroke="#3f51b5" rx="6"/>
